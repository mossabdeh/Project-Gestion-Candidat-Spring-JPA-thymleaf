server.port=8082
spring.datasource.url=jdbc:h2:mem:doc

# The H2 web console is never exposed by default.
spring.h2.console.enabled=false

# Reduce potentially sensitive SQL and authentication log noise by default.
logging.level.org.springframework.security=INFO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
