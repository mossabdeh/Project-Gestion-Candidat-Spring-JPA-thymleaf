<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{AdminTemplate}">
<head><title>Add Candidate</title></head><body><section layout:fragment="content1"><nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{getCandidats}">Candidates</a><span aria-hidden="true">/</span><span>Create account</span></nav>
<div class="page-heading"><div><span class="eyebrow">ACCOUNT MANAGEMENT</span><h1>Add Candidat</h1><p class="subheading">Create a new account.</p></div></div>
<section class="form-panel" aria-label="Add candidate"><div class="form-intro"><h2>Account details</h2><p>Complete the form to create an account.</p></div>
<form method="post" th:action="@{saveCandidat}" th:object="${candidat}">

<div class="form-grid"><div class="field"><label for="candidat-nom">Nom</label><input class="form-control" id="candidat-nom" name="nom" type="text" th:value="*{nom}" th:attr="aria-invalid=${#fields.hasErrors('nom')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span></div>
<div class="field"><label for="candidat-prenom">Prenom</label><input class="form-control" id="candidat-prenom" name="prenom" type="text" th:value="*{prenom}" th:attr="aria-invalid=${#fields.hasErrors('prenom')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span></div>
<div class="field"><label for="candidat-username">Username</label><input class="form-control" id="candidat-username" name="username" type="text" th:value="*{username}" th:attr="aria-invalid=${#fields.hasErrors('username')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span></div>
<div class="field"><label for="candidat-email">Email</label><input class="form-control" id="candidat-email" name="email" type="email" th:value="*{email}" th:attr="aria-invalid=${#fields.hasErrors('email')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div>
<div class="field"><label for="candidat-dateNaissance">Date of birth</label><input class="form-control" id="candidat-dateNaissance" name="dateNaissance" type="date" th:value="*{dateNaissance}" th:attr="aria-invalid=${#fields.hasErrors('dateNaissance')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}"></span></div>
<div class="field"><label for="candidat-password">Password</label><input class="form-control" id="candidat-password" name="password" type="password" autocomplete="new-password" th:attr="aria-invalid=${#fields.hasErrors('password')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span></div></div><div class="form-actions"><a class="action-cancel" th:href="@{getCandidats}">Cancel</a><button type="submit" class="action-primary">Save</button></div>
</form></section></section></body></html>
