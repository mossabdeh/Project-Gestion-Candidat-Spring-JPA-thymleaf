<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{AdminTemplate}">
<head><title>Create administrator</title></head>
<body>
<section layout:fragment="content1">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{/admin/getAdmins}">Administrators</a><span aria-hidden="true">/</span><span>Create account</span></nav>
  <div class="page-heading gap-4"><div><span class="eyebrow">ACCOUNT MANAGEMENT</span>
    <h1>Add Admin</h1><p class="subheading">Create a new administrator account.</p></div></div>
  <section class="form-panel overflow-hidden" aria-label="Create administrator">
    <div class="form-intro"><h2>Account details</h2><p>All fields are required. Use a unique username and a strong password.</p></div>
    <form method="post" th:action="@{saveAdmin}" th:object="${admin}" novalidate="novalidate">
      <div class="form-grid gap-6">
        <div class="field">
          <label for="nom">Nom <span aria-hidden="true">*</span></label>
          <input id="nom" type="text" th:field="*{nom}" autocomplete="family-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('nom')},aria-describedby=${#fields.hasErrors('nom')} ? 'nom-error' : null">
          <span id="nom-error" class="field-error text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </div>
        <div class="field">
          <label for="prenom">Prenom <span aria-hidden="true">*</span></label>
          <input id="prenom" type="text" th:field="*{prenom}" autocomplete="given-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('prenom')},aria-describedby=${#fields.hasErrors('prenom')} ? 'prenom-error' : null">
          <span id="prenom-error" class="field-error text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
        </div>
        <div class="field">
          <label for="username">Username <span aria-hidden="true">*</span></label>
          <input id="username" type="text" th:field="*{username}" autocomplete="off" required
                 th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username')} ? 'username-error' : null">
          <span id="username-error" class="field-error text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input id="email" type="email" th:field="*{email}" autocomplete="email" required
                 th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null">
          <span id="email-error" class="field-error text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="field field-full">
          <label for="password">Password <span aria-hidden="true">*</span></label>
          <input id="password" type="password" th:field="*{password}" autocomplete="new-password" minlength="12" required
                 aria-describedby="password-help"
                 th:attr="aria-invalid=${#fields.hasErrors('password')}">
          <small id="password-help" class="field-help">Use at least 12 characters. The password must differ from the username.</small>
          <span class="field-error text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
      </div>
      <div class="form-actions">
        <a class="action-cancel transition-colors duration-200" th:href="@{/admin/getAdmins}">Cancel</a>
        <button type="submit" class="action-primary transition-colors duration-200">Save</button>
      </div>
    </form>
  </section>
</section>
</body>
</html>
