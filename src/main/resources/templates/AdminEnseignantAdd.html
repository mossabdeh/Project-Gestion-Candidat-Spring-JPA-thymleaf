<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{AdminTemplate}">
<head><title>Add Teacher</title></head><body><section layout:fragment="content1"><nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{getEnseignants}">Teachers</a><span aria-hidden="true">/</span><span>Create account</span></nav>
<div class="page-heading"><div><span class="eyebrow">ACCOUNT MANAGEMENT</span><h1>Add Enseignant</h1><p class="subheading">Create a new account.</p></div></div>
<section class="form-panel" aria-label="Add teacher"><div class="form-intro"><h2>Account details</h2><p>Complete the form to create an account.</p></div>
<form method="post" th:action="@{saveEnseignant}" th:object="${enseignant}">

<div class="form-grid"><div class="field"><label for="enseignant-nom">Nom</label><input class="form-control" id="enseignant-nom" name="nom" type="text" th:value="*{nom}" th:attr="aria-invalid=${#fields.hasErrors('nom')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span></div>
<div class="field"><label for="enseignant-prenom">Prenom</label><input class="form-control" id="enseignant-prenom" name="prenom" type="text" th:value="*{prenom}" th:attr="aria-invalid=${#fields.hasErrors('prenom')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span></div>
<div class="field"><label for="enseignant-username">Username</label><input class="form-control" id="enseignant-username" name="username" type="text" th:value="*{username}" th:attr="aria-invalid=${#fields.hasErrors('username')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span></div>
<div class="field"><label for="enseignant-email">Email</label><input class="form-control" id="enseignant-email" name="email" type="email" th:value="*{email}" th:attr="aria-invalid=${#fields.hasErrors('email')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div>
<div class="field"><label for="enseignant-grade">Grade</label><select class="form-control" id="enseignant-grade" name="grade"><option value="professeur" th:selected="${enseignant.grade == 'professeur'}">Professeur</option><option value="MCA" th:selected="${enseignant.grade == 'MCA'}">MCA</option></select><span class="field-error text-danger" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></span></div>
<div class="field"><label for="enseignant-specialite">Specialty</label><select class="form-control" id="enseignant-specialite" name="specialite"><option th:each="matier : ${T(ntic.tlsi.gestiondoctorat2.entities.Matier).values()}" th:value="${matier}" th:text="${matier}" th:selected="${enseignant.specialite == matier}"></option></select><span class="field-error text-danger" th:if="${#fields.hasErrors('specialite')}" th:errors="*{specialite}"></span></div>
<div class="field"><label for="enseignant-password">Password</label><input class="form-control" id="enseignant-password" name="password" type="password" autocomplete="new-password" th:attr="aria-invalid=${#fields.hasErrors('password')}" /><span class="field-error text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span></div></div><div class="form-actions"><a class="action-cancel" th:href="@{getEnseignants}">Cancel</a><button type="submit" class="action-primary">Save</button></div>
</form></section></section></body></html>
