<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate Portal | Doctorat</title>
  <link rel="icon" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/candidate.css}">
</head>
<body class="candidate-app">
  <a class="skip-to-content" href="#candidate-main">Skip to content</a>
  <header class="candidate-header">
    <div class="header-inner">
      <a class="candidate-brand" th:href="@{/candidatPage}">Doctorat<span class="brand-accent">.</span></a>
      <nav class="candidate-nav" aria-label="Main navigation">
        <a th:href="@{/candidatPage}">Home</a>
        <a th:href="@{/candidat/getConcourInfo}">Competition details</a>
        <a th:href="@{/candidat/ResultatCandidat}">My results</a>
      </nav>
      <div class="header-account">
        <span class="signed-in" th:text="${#authentication.name}">Candidate</span>
        <form method="post" th:action="@{/logout}"><button class="button button-outline" type="submit">Sign out</button></form>
      </div>
    </div>
  </header>
  <main id="candidate-main" class="candidate-main" tabindex="-1">
    <section layout:fragment="candidateContent"></section>
  </main>
  <footer class="candidate-footer">Doctorat · Candidate portal</footer>
</body>
</html>
