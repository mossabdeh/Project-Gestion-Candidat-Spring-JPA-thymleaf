<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE | Doctorat Admin">Doctorat Admin</title>
  <link rel="icon" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-app">
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Administrator navigation">
    <a class="admin-brand" th:href="@{/adminPage}">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span><strong>Doctorat</strong><small>Administration</small></span>
    </a>
    <p class="nav-caption">WORKSPACE</p>
    <nav class="admin-nav" aria-label="Primary">
      <a th:href="@{/adminPage}"><span aria-hidden="true">▦</span> Overview</a>
      <a th:href="@{/admin/getAdmins}"><span aria-hidden="true">◉</span> Administrators</a>
      <a th:href="@{/candidat/getCandidats}"><span aria-hidden="true">▤</span> Candidates</a>
      <a th:href="@{/enseignant/getEnseignants}"><span aria-hidden="true">▥</span> Teachers</a>
      <a th:href="@{/vd/getVDs}"><span aria-hidden="true">◇</span> Vice Deans</a>
      <a th:href="@{/cfd/getCFDs}"><span aria-hidden="true">▧</span> CFD</a>
    </nav>
    <div class="sidebar-footer">
      <span class="sidebar-avatar" aria-hidden="true">A</span>
      <span class="sidebar-identity"><small>Signed in as</small><strong th:text="${#authentication.name}">admin</strong></span>
    </div>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <div class="topbar-left">
        <details class="mobile-navigation">
          <summary aria-label="Open navigation">☰ <span>Menu</span></summary>
          <nav aria-label="Mobile navigation" class="mobile-links">
            <a th:href="@{/adminPage}">Overview</a>
            <a th:href="@{/admin/getAdmins}">Administrators</a>
            <a th:href="@{/candidat/getCandidats}">Candidates</a>
            <a th:href="@{/enseignant/getEnseignants}">Teachers</a>
            <a th:href="@{/vd/getVDs}">Vice Deans</a>
            <a th:href="@{/cfd/getCFDs}">CFD</a>
          </nav>
        </details>
        <span class="workspace-title">Doctoral competition management</span>
      </div>
      <div class="topbar-right">
        <span class="user-label" th:text="${#authentication.name}">admin</span>
        <form method="post" th:action="@{/logout}">
          <button type="submit" class="sign-out">Logout</button>
        </form>
      </div>
    </header>
    <main id="main-content" class="admin-main" tabindex="-1">
      <section layout:fragment="content1"></section>
    </main>
  </div>
</div>
</body>
</html>
