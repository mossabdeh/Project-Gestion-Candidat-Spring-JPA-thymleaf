<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{AdminTemplate}">
<head><title>Edit administrator</title></head>
<body>
<section layout:fragment="content1">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{/admin/getAdmins}">Administrators</a><span aria-hidden="true">/</span><span>Edit account</span></nav>
  <div class="page-heading"><div><span class="eyebrow">ACCOUNT MANAGEMENT</span>
    <h1>Edit Admin</h1><p class="subheading">Update profile details without changing the account's password or permissions.</p></div></div>
  <section class="form-panel" aria-label="Edit administrator">
    <div class="form-intro"><h2>Profile information</h2><p>Only contact and identity details can be changed here.</p></div>
    <form method="post" th:action="@{saveEditedAdmin(page=${page},keyword=${keyword})}" th:object="${admin}" novalidate="novalidate">
      <input type="hidden" name="id" th:value="*{id}">
      <div class="form-grid">
        <div class="field">
          <label for="nom">Nom <span aria-hidden="true">*</span></label>
          <input id="nom" type="text" th:field="*{nom}" autocomplete="family-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('nom')},aria-describedby=${#fields.hasErrors('nom')} ? 'nom-error' : null">
          <span id="nom-error" class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </div>
        <div class="field">
          <label for="prenom">Prenom <span aria-hidden="true">*</span></label>
          <input id="prenom" type="text" th:field="*{prenom}" autocomplete="given-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('prenom')},aria-describedby=${#fields.hasErrors('prenom')} ? 'prenom-error' : null">
          <span id="prenom-error" class="field-error" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
        </div>
        <div class="field">
          <label for="username">Username <span aria-hidden="true">*</span></label>
          <input id="username" type="text" th:field="*{username}" autocomplete="off" required
                 th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username')} ? 'username-error' : null">
          <span id="username-error" class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input id="email" type="email" th:field="*{email}" autocomplete="email" required
                 th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null">
          <span id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
      </div>
      <div class="form-actions">
        <a class="action-cancel" th:href="@{/admin/getAdmins}">Cancel</a>
        <button type="submit" class="action-primary">Save</button>
      </div>
    </form>
  </section>
</section>
</body>
</html>
