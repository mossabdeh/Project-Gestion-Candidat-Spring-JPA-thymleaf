<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{AdminTemplate}">
<head><title>Edit CFD member</title></head>
<body>
<section layout:fragment="content1">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a th:href="@{/cfd/getCFDs}">CFD members</a>
    <span aria-hidden="true">/</span><span>Edit account</span>
  </nav>
  <div class="page-heading gap-4">
    <div><span class="eyebrow">ACCOUNT MANAGEMENT</span>
      <h1>Edit CFD member</h1>
      <p class="subheading">Update contact and identity details for this account.</p>
    </div>
  </div>
  <section class="form-panel overflow-hidden" aria-label="Edit CFD member">
    <div class="form-intro">
      <h2>Profile information</h2>
      <p>Make changes to this account's profile. A password cannot be changed here.</p>
    </div>
    <form method="post" th:action="@{saveEditedCFD(page=${page},keyword=${keyword})}" th:object="${cfd}" novalidate="novalidate">
      <input type="hidden" th:field="*{id}">
      <div class="form-grid gap-6">
        <div class="field">
          <label for="cfd-nom">Nom <span aria-hidden="true">*</span></label>
          <input id="cfd-nom" type="text" th:field="*{nom}" autocomplete="family-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('nom')},aria-describedby=${#fields.hasErrors('nom')} ? 'cfd-nom-error' : null">
          <span id="cfd-nom-error" class="field-error text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </div>
        <div class="field">
          <label for="cfd-prenom">Prenom <span aria-hidden="true">*</span></label>
          <input id="cfd-prenom" type="text" th:field="*{prenom}" autocomplete="given-name" required
                 th:attr="aria-invalid=${#fields.hasErrors('prenom')},aria-describedby=${#fields.hasErrors('prenom')} ? 'cfd-prenom-error' : null">
          <span id="cfd-prenom-error" class="field-error text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
        </div>
        <div class="field">
          <label for="cfd-username">Username <span aria-hidden="true">*</span></label>
          <input id="cfd-username" type="text" th:field="*{username}" autocomplete="off" required
                 th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username')} ? 'cfd-username-error' : null">
          <span id="cfd-username-error" class="field-error text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>
        <div class="field">
          <label for="cfd-email">Email <span aria-hidden="true">*</span></label>
          <input id="cfd-email" type="email" th:field="*{email}" autocomplete="email" required
                 th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'cfd-email-error' : null">
          <span id="cfd-email-error" class="field-error text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
      </div>
      <div class="form-actions">
        <a class="action-cancel transition-colors duration-200" th:href="@{/cfd/getCFDs}">Cancel</a>
        <button type="submit" class="action-primary transition-colors duration-200">Save</button>
      </div>
    </form>
  </section>
</section>
</body>
</html>
