# Optional manual-testing accounts. Disabled unless explicitly enabled.
# Passwords are read from DEV_SEED_PASSWORD, never checked into source control.
dev.seed.enabled=${DEV_SEED_ENABLED:false}

# Development-only console. It is restricted to authenticated ADMIN in SecConfig.
# Do not expose this application directly on public interfaces while using H2.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false
